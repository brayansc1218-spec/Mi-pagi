<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Datos del dispositivo</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#111827;font-family:system-ui,-apple-system,sans-serif}
main{max-width:520px;margin:auto;padding:24px 16px}
.card{background:white;border-radius:20px;padding:22px;box-shadow:0 8px 30px #0001}
h1{font-size:24px;margin:0 0 8px}
p{color:#4b5563;line-height:1.5}
button{width:100%;padding:15px;border:0;border-radius:14px;background:#111827;color:white;font-size:16px;font-weight:700}
#datos{margin-top:18px}
.item{padding:13px 0;border-bottom:1px solid #e5e7eb}
.item b{display:block;font-size:13px;color:#6b7280;margin-bottom:4px}
.item span{word-break:break-word}
.small{font-size:12px;color:#6b7280;margin-top:16px}
</style>
</head>
<body>
<main>
<div class="card">
<h1>📱 Información del dispositivo</h1>
<p>Al pulsar el botón, esta página muestra información técnica que tu navegador permite consultar.</p>
<button onclick="mostrar()">Mostrar mis datos</button>
<div id="datos"></div>
<div class="small">No se accede a contraseñas, archivos, mensajes, contactos ni contenido privado del dispositivo.</div>
</div>
</main>
<script>
function mostrar(){
 const ua=navigator.userAgent;
 const tipo=/Mobi|Android|iPhone|iPad/i.test(ua)?"Celular/tablet":"Computadora";
 const datos=[
 ["Tipo de dispositivo",tipo],
 ["Sistema/plataforma",navigator.platform||"No disponible"],
 ["Navegador",ua],
 ["Idioma",navigator.language||"No disponible"],
 ["Pantalla",screen.width+" × "+screen.height],
 ["Zona horaria",Intl.DateTimeFormat().resolvedOptions().timeZone||"No disponible"],
 ["Hora local",new Date().toLocaleString()],
 ["Cookies habilitadas",navigator.cookieEnabled?"Sí":"No"],
 ["Conexión",navigator.onLine?"En línea":"Sin conexión"]
 ];
 document.getElementById("datos").innerHTML=datos.map(([a,b])=>
 `<div class="item"><b>${a}</b><span>${escapeHtml(b)}</span></div>`).join("");
}
function escapeHtml(s){
 return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
</script>
</body>
</html>
